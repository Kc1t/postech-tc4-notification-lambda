<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>{{.Title}} · OS #{{.Code}}</title></head>
<body style="margin:0;padding:24px;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#1f2933">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px">
    <tr><td style="padding:24px 28px 8px;font-size:13px;color:#52606d">Oficina Reservoir Devs · OS #{{.Code}}</td></tr>
    <tr><td style="padding:0 28px;font-size:20px;font-weight:bold">{{.Title}}</td></tr>
    <tr><td style="padding:16px 28px;font-size:15px;line-height:1.5">{{.Greeting}}!<br><br>{{.Body}}</td></tr>
    {{if .ShowButton}}
    <tr><td style="padding:0 28px 24px">
      <a href="{{.CheckoutURL}}" style="display:inline-block;background:#009ee3;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:6px;font-weight:bold">Pagar com Mercado Pago</a>
    </td></tr>
    {{end}}
    <tr><td style="padding:16px 28px 24px;font-size:12px;color:#7b8794">Mensagem automática. Responda este e-mail se precisar falar com a oficina.</td></tr>
  </table>
</body>
</html>
